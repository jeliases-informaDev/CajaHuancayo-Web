server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cabeceras de seguridad (los "location" de abajo no usan add_header para no perderlas).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Archivos con huella en el nombre: se pueden guardar un anio.
    location /assets/ { expires 1y; try_files $uri =404; }

    # Fuentes del inicio de sesion (no cambian de nombre): 30 dias de cache.
    location /fonts/ { expires 30d; try_files $uri =404; }

    # Aplicacion de una sola pagina: cualquier ruta devuelve index.html, sin cache.
    location / { expires -1; try_files $uri /index.html; }
}
