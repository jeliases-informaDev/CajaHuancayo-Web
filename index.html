<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f2f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090d22" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Plataforma para auditar visitas de crédito en campo: ubicación contrastada, evidencia con huella y ficha firmada por el cliente." />
    <title>Auditoría de Visitas</title>
    <!-- El tema se decide antes de pintar para que no parpadee entre claro y oscuro. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("ch_theme") || "light";
          var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePref = pref;
          // La barra lateral compacta es la del diseño: sale así salvo que la persona ya haya elegido expandirla (ch_rail = 0).
          var rail = localStorage.getItem("ch_rail");
          if (rail === null || rail === "1") document.documentElement.dataset.rail = "1";
        } catch (e) { document.documentElement.dataset.theme = "light"; document.documentElement.dataset.rail = "1"; }
      })();
    </script>
    <link rel="preload" href="/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/BeVietnamPro-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/BeVietnamPro-600.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
